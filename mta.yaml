_schema-version: "3.2"
ID: hypera-conferencia
description: POC Hypera - Conferência de Embarque
version: 1.0.0

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

modules:
  - name: hypera-conferencia-destination-content
    type: com.sap.application.content
    requires:
      - name: hypera-conferencia-destination-service
        parameters:
          content-target: true
      - name: hypera-conferencia-html5-repo-host
        parameters:
          service-key:
            name: hypera-conferencia-html5-repo-host-key
      - name: hypera-conferencia-auth
        parameters:
          service-key:
            name: hypera-conferencia-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: hypera_conferencia_html_repo_host
              ServiceInstanceName: hypera-conferencia-html5-repo-host
              ServiceKeyName: hypera-conferencia-html5-repo-host-key
              sap.cloud.service: hypera.conferencia
            - Authentication: OAuth2UserTokenExchange
              Name: hypera_conferencia_uaa
              ServiceInstanceName: hypera-conferencia-xsuaa-srv
              ServiceKeyName: hypera-conferencia-auth-key
              sap.cloud.service: hypera.conferencia
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true

  - name: hypera-conferencia-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: hypera-conferencia-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: hypera-conferencia-ui
          artifacts:
            - hyperaconferenciaui.zip
          target-path: resources/

  - name: hypera-conferencia-ui
    type: html5
    path: app/conferencia-ui
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      build-result: dist
      supported-platforms: []

resources:
  - name: hypera-conferencia-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: hypera-conferencia-destination-service
      service-plan: lite

  - name: hypera-conferencia-auth
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: hypera-conferencia-xsuaa-srv
      service-plan: application

  - name: hypera-conferencia-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: hypera-conferencia-html5-repo-host
      service-plan: app-host
