_schema-version: 3.3.0
ID: hypera-conferencia
version: 1.0.0
description: POC Hypera - Conferência de Embarque

# MODO MOCK (conta trial): módulos de backend e HANA comentados.
# Para reativar o deploy completo, descomentar todos os blocos marcados com [TRIAL-DISABLED].

parameters:
  enable-parallel-deployments: true


build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        # [TRIAL-DISABLED] npx cds build --production

modules:
  # [TRIAL-DISABLED] Backend CAP — requer HANA HDI container (não disponível em trial gratuito).
  # - name: hypera-conferencia-srv
  #   type: nodejs
  #   path: gen/srv
  #   parameters:
  #     buildpack: nodejs_buildpack
  #     memory: 512M
  #     disk-quota: 1024M
  #   provides:
  #     - name: srv-api
  #       properties:
  #         srv-url: ${default-url}
  #   requires:
  #     - name: hypera-conferencia-auth
  #     - name: hypera-conferencia-db

  # [TRIAL-DISABLED] Deployer do schema HANA — requer HDI container.
  # - name: hypera-conferencia-db-deployer
  #   type: hdb
  #   path: gen/db
  #   parameters:
  #     buildpack: nodejs_buildpack
  #   requires:
  #     - name: hypera-conferencia-db

  - name: hypera-conferencia-ui
    type: html5
    path: app/conferencia-ui
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npx ui5 build --config ui5.yaml --clean-dest --dest dist
      build-result: dist
      supported-platforms: []

  - name: hypera-conferencia-app-content
    type: com.sap.application.content
    path: .
    build-parameters:
      build-result: resources
      requires:
        - name: hypera-conferencia-ui
          artifacts:
            - hyperaconferenciaui.zip
          target-path: resources/
    requires:
      - name: hypera-conferencia-html5-repo-host
        parameters:
          content-target: true
      # [TRIAL-DISABLED] Destination depende do srv-api que está desabilitado.
      # - name: hypera-conferencia-destination
      #   parameters:
      #     content-target: true
      # [TRIAL-DISABLED] Auth XSUAA desabilitado junto com o backend.
      # - name: hypera-conferencia-auth
      #   parameters:
      #     service-key:
      #       name: hypera-conferencia-auth-key
    parameters:
      content:
        instance:
          destinations:
            # [TRIAL-DISABLED] Destinations de auth e backend removidos (dependem do srv).
            # - Name: hypera-conferencia-auth
            #   ServiceInstanceName: hypera-conferencia-auth
            #   ServiceKeyName: hypera-conferencia-auth-key
            #   Authentication: OAuth2UserTokenExchange
            - Name: hypera-conferencia-html5-repo-host
              ServiceInstanceName: hypera-conferencia-html5-repo-host
              ServiceKeyName: hypera-conferencia-html5-repo-host-key
          existing_destinations_policy: update

resources:
  # [TRIAL-DISABLED] HANA HDI container — serviço 'hana' não disponível em trial gratuito.
  # - name: hypera-conferencia-db
  #   type: com.sap.xs.hdi-container
