# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: hypera.conferencia.ui
type: application
builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: hyperaconferenciaui
        additionalFiles:
          - xs-app.json
resources:
  configuration:
    paths:
      webapp: webapp
